name: Site problem
description: Report a broken page, link, contact form or display.
title: "[Site] "
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not include personal health information, household details,
        credentials or contact addresses. Remove them from URLs, screenshots and logs.
        Report security problems through [the security policy](https://github.com/openhra/website/blob/main/SECURITY.md).
  - type: input
    id: page
    attributes:
      label: Page URL
      description: Link the affected OpenHRA or OpenPlans page. Remove query values that contain private data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Include the browser version, operating system and device type. For a display problem, include the window size if known.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe what you clicked or entered, using no personal health information or other private data.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What did you see?
      description: Include the error or a screenshot after removing private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed personal health information, household details, credentials and contact addresses.
          required: true
